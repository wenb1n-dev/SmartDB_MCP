[project]
name = "SmartDB_MCP"
version = "1.0.0"
license = { text = "MIT" }
description = "SmartDB is a universal database gateway that implements the Model Context Protocol (MCP) server interface.SmartDB not only provides basic database connection and exploration capabilities but also adds advanced features such as OAuth 2.0 authentication , health checks, SQL optimization, and index health detection, making database management and maintenance more secure and intelligent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.8.0",
    "python-dotenv>=1.1.0",
    "starlette>=0.46.1",
    "uvicorn>=0.34.0",
    "PyJWT>=2.8.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.10",
    "oracledb>=3.3.0",
    "cx_Oracle>=8.3.0",
    "pymssql>=2.3.7",
    "pyodbc >=5.2.0",
    "pydantic-settings~=2.10.1",
    "click~=8.2.1",
    "sqlparse>=0.5.0",
    "redis>=5.0.0",
    "pymongo>=4.8.0",
    "pymilvus>=2.4.0",
    "elasticsearch>=8.0.0",
    # 采用社区维护分叉 kafka-python-ng（导入名仍为 kafka，兼容 2.x 配置项，
    # 支持 Python 3.12+）。勿用被接管的 kafka-python 3.x（移除配置项且有供应链风险），
    # 官方 kafka-python 2.0.2 在 Python 3.12+ 存在 kafka.vendor.six.moves 导入缺陷。
    "kafka-python-ng>=2.2.2",
]

[[project.authors]]
name = "wenb1n"

[project.scripts]
smartdb = "core.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build]
packages = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/config", "src/connection", "src/tools", "src/oauth", "src/utils", "src/datasource", "src/permission", "src/static", "src/datasource/relational", "src/datasource/relational/mysql", "src/datasource/relational/postgresql", "src/datasource/relational/oracle", "src/datasource/relational/mssqlserver", "src/datasource/relational/dameng", "src/datasource/kv", "src/datasource/kv/redis", "src/datasource/document", "src/datasource/document/mongodb", "src/datasource/vector", "src/datasource/vector/milvus", "src/datasource/search_engine", "src/datasource/search_engine/elasticsearch", "src/datasource/message_queue", "src/datasource/message_queue/kafka"]

[project.urls]
Homepage = "https://github.com/wenb1n-dev/SmartDB_MCP"
Documentation = "https://github.com/wenb1n-dev/SmartDB_MCP/blob/main/README.md"
Repository = "https://github.com/wenb1n-dev/SmartDB_MCP.git"
