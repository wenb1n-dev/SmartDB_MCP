[project]
name = "SmartDB_MCP"
version = "1.0.0"
license = { text = "MIT" }
description = "SmartDB is a universal database gateway that implements the Model Context Protocol (MCP) server interface.SmartDB not only provides basic database connection and exploration capabilities but also adds advanced features such as OAuth 2.0 authentication , health checks, SQL optimization, and index health detection, making database management and maintenance more secure and intelligent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.8.0",
    "python-dotenv>=1.1.0",
    "starlette>=0.46.1",
    "uvicorn>=0.34.0",
    "PyJWT>=2.8.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.10",
    "oracledb>=3.3.0",
    "cx_Oracle>=8.3.0",
    "pymssql>=2.3.7",
    "pyodbc >=5.2.0",
    "pydantic-settings~=2.10.1",
    "click~=8.2.1",
    "sqlparse>=0.5.0",
    "redis>=5.0.0",
    "pymongo>=4.8.0",
    "pymilvus>=2.4.0",
    "elasticsearch>=8.0.0",
    # 采用社区维护分叉 kafka-python-ng（导入名仍为 kafka，兼容 2.x 配置项，
    # 支持 Python 3.12+）。勿用被接管的 kafka-python 3.x（移除配置项且有供应链风险），
    # 官方 kafka-python 2.0.2 在 Python 3.12+ 存在 kafka.vendor.six.moves 导入缺陷。
    "kafka-python-ng>=2.2.2",
]

[[project.authors]]
name = "wenb1n"

[project.scripts]
smartdb = "core.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build]
packages = ["src"]

[tool.hatch.build.targets.wheel]
# hatchling 会递归包含每个目录下的子包，只需列出 src 下的顶层包；
# 同时列出父包与子包会导致新版 hatchling 报 "second file at same path"。
packages = ["src/core", "src/config", "src/connection", "src/tools", "src/oauth", "src/utils", "src/datasource", "src/permission", "src/static"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[project.urls]
Homepage = "https://github.com/wenb1n-dev/SmartDB_MCP"
Documentation = "https://github.com/wenb1n-dev/SmartDB_MCP/blob/main/README.md"
Repository = "https://github.com/wenb1n-dev/SmartDB_MCP.git"
